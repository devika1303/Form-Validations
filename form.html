<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    
    <div class="container">
        <h1>Registration Form</h1>

        <form id="registraion-form">
            <div class="form">
                <label for="Full Name">Full Name</label>
                <input type="text"id="Full Name"placeholder="Enter Your Full name">
                <small id="nameError"> </small>

            </div> 

            <div class="form">
                <label for="EmailId">EmailId</label>
                <input type="email" id="EmailId"placeholder="Enter Your Mail Id">
                <small id="emailError"> </small>

            </div>

            <div class="form">
                <label for="Mobile">Mobile</label>
                <input type="number" id="Mobile" placeholder="Enter Your Mobile Number">
                <small id="mobileError"> </small>

            </div>


            <div class="form">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Your Password">
                <small id="passwordError"> </small>

            </div>


            <div class="form">
                <label for="confirmpassword">Confirm password</label>
                <input type="password" id="confirmpassword" placeholder="Enter Your Confirm Password">
                <small id="passwordError"> </small>

            </div>                       

        </form>
        


    </div>

<script src="form.js"></script>

</body>
</html>
